<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPINCON — the ICON wheel of questionable fortune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16241E;
  --felt:#416557;
  --felt-deep:#2B463C;
  --cream:#FBF6E9;
  --paper:#FFFDF6;
  --gold:#FBC748;
  --butter:#FBD36D;
  --teal:#53AE9A;
  --mint:#7FC9AC;
  --rule:rgba(22,36,30,.14);
  --display:"Bricolage Grotesque","Space Grotesk",system-ui,sans-serif;
  --body:"Space Grotesk",system-ui,-apple-system,sans-serif;
  --meme:Impact,Haettenschweiler,"Arial Narrow Bold","Anton",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--body);
  color:var(--cream);
  background:
    radial-gradient(120% 90% at 50% -10%, #557C6B 0%, var(--felt) 42%, var(--felt-deep) 100%);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
  background-size:5px 5px;mix-blend-mode:overlay;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- top bar ---------- */
.topbar{
  position:relative;z-index:3;
  display:flex;align-items:center;gap:14px;
  padding:16px clamp(14px,3vw,30px);
  border-bottom:1px solid rgba(251,214,109,.18);
}
.brandmark{width:38px;height:38px;border-radius:9px;background:var(--paper);padding:3px;flex:none;
  box-shadow:0 3px 0 rgba(0,0,0,.22)}
.brandmark img{width:100%;height:100%;display:block;border-radius:6px}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{
  font-family:var(--display);font-weight:800;font-size:clamp(20px,2.6vw,27px);
  letter-spacing:-.02em;color:var(--gold);
}
.wordmark b i{font-style:normal;color:var(--paper)}
.wordmark span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(251,246,233,.55);margin-top:5px}
.topbar .spacer{flex:1}
.chip{
  border:1px solid rgba(251,246,233,.24);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:500;letter-spacing:.04em;
  color:rgba(251,246,233,.82);background:rgba(0,0,0,.14);
  transition:.16s;
}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}

/* ---------- shell ---------- */
.shell{
  position:relative;z-index:2;
  display:grid;grid-template-columns:minmax(0,1fr) 372px;
  gap:clamp(14px,2.2vw,28px);
  padding:clamp(14px,2.4vw,28px);
  align-items:start;
}
@media (max-width:1000px){ .shell{grid-template-columns:minmax(0,1fr)} }

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.wheelwrap{
  position:relative;width:min(70vh,100%,620px);aspect-ratio:1;
  display:grid;place-items:center;
  filter:drop-shadow(0 26px 34px rgba(0,0,0,.34));
}
#wheel{width:100%;height:100%;display:block;border-radius:50%;touch-action:manipulation}
.hub{
  position:absolute;width:23%;aspect-ratio:1;border-radius:50%;
  background:var(--paper);display:grid;place-items:center;padding:11%;
  box-shadow:0 0 0 7px var(--ink), 0 0 0 10px var(--gold), 0 10px 22px rgba(0,0,0,.4);
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.hub:hover{transform:scale(1.06)}
.hub:active{transform:scale(.95)}
.hub img{width:100%;display:block;pointer-events:none}
.flapper{
  position:absolute;top:-14px;left:50%;width:52px;height:74px;margin-left:-26px;
  transform-origin:50% 12%;z-index:4;
  transform:rotate(var(--flap,0deg));
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.4));
}
.flapper svg{width:100%;height:100%;display:block}

/* spin button */
.spinbtn{
  font-family:var(--display);font-weight:800;letter-spacing:.02em;
  font-size:clamp(21px,3vw,30px);
  color:var(--ink);background:var(--gold);
  padding:16px 46px;border-radius:999px;
  box-shadow:0 7px 0 #C8922A, 0 16px 26px rgba(0,0,0,.32);
  transition:transform .1s, box-shadow .1s, background .2s;
}
.spinbtn:hover{background:var(--butter)}
.spinbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #C8922A,0 8px 14px rgba(0,0,0,.3)}
.spinbtn:disabled{opacity:.45;box-shadow:0 7px 0 #C8922A;cursor:not-allowed;transform:none}
.hint{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(251,246,233,.42);margin-top:-8px}

/* odds ribbon */
.ribbonbox{width:min(100%,620px)}
.ribbonhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.ribbonhead h3{margin:0;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:rgba(251,246,233,.6)}
.ribbonhead em{font-style:normal;font-size:12px;color:rgba(251,246,233,.42)}
.ribbon{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.28);background:rgba(0,0,0,.25)}
.ribbon div{position:relative;transition:flex-grow .35s cubic-bezier(.4,0,.2,1)}
.ribbon div::after{
  content:attr(data-pct);position:absolute;inset:0;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;color:rgba(0,0,0,.62);
}
.ribbon div[data-narrow]::after{content:""}

/* history */
.history{width:min(100%,620px);display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:30px}
.history .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(251,246,233,.35)}
.tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.24);border:1px solid rgba(251,246,233,.16);
  padding:5px 11px;border-radius:999px;font-size:12.5px;color:rgba(251,246,233,.85);
  animation:pop .3s cubic-bezier(.34,1.56,.64,1);
}
.tag i{width:8px;height:8px;border-radius:50%;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- rail ---------- */
.rail{
  background:var(--paper);color:var(--ink);border-radius:var(--r);
  box-shadow:0 18px 40px rgba(0,0,0,.3);
  overflow:hidden;position:sticky;top:18px;
}
.railhead{
  display:flex;align-items:center;gap:10px;padding:15px 16px;
  background:var(--ink);color:var(--cream);
}
.railhead h2{margin:0;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}
.railhead .sum{margin-left:auto;font-size:11.5px;color:var(--mint);letter-spacing:.05em}
.rows{max-height:min(56vh,560px);overflow:auto;padding:8px}
.row{border-bottom:1px dashed var(--rule);padding:9px 4px}
.row:last-child{border-bottom:0}
.rowmain{display:flex;align-items:center;gap:8px}
.swatch{width:26px;height:26px;border-radius:8px;border:2px solid rgba(0,0,0,.16);flex:none;padding:0;overflow:hidden;position:relative}
.swatch input{position:absolute;inset:-6px;width:200%;height:200%;border:0;padding:0;cursor:pointer;background:none}
.nm{flex:1;min-width:0;border:1px solid var(--rule);border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:500;background:var(--cream)}
.wt{width:62px;border:1px solid var(--rule);border-radius:9px;padding:8px 6px;font-size:13px;text-align:center;background:var(--cream);font-variant-numeric:tabular-nums}
.nm:focus,.wt:focus,.mm input:focus,.mm textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
.pct{width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.iconbtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:rgba(22,36,30,.45);font-size:15px;transition:.15s}
.iconbtn:hover{background:rgba(22,36,30,.08);color:var(--ink)}
.iconbtn.on{background:var(--gold);color:var(--ink)}
.mm{display:none;gap:7px;padding:10px;margin-top:8px;background:var(--cream);border-radius:10px;border:1px solid var(--rule)}
.row.open .mm{display:grid;grid-template-columns:52px 1fr}
.mm .emo{grid-row:span 2;font-size:26px;text-align:center;border:1px solid var(--rule);border-radius:9px;background:var(--paper);padding:4px}
.mm input[type=text]{border:1px solid var(--rule);border-radius:9px;padding:7px 9px;font-size:12.5px;background:var(--paper)}
.mm .file{grid-column:span 2;display:flex;align-items:center;gap:8px;font-size:11.5px;color:rgba(22,36,30,.55)}
.mm .file label{cursor:pointer;border:1px dashed rgba(22,36,30,.3);border-radius:8px;padding:6px 10px;font-weight:500}
.mm .file label:hover{border-color:var(--teal);color:var(--teal)}
.mm .file input{display:none}
.mm .thumb{width:34px;height:34px;object-fit:cover;border-radius:7px;border:1px solid var(--rule)}
.railfoot{padding:12px 16px 16px;border-top:1px solid var(--rule);display:grid;gap:11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.mini{
  border:1px solid rgba(22,36,30,.2);border-radius:9px;padding:8px 12px;
  font-size:12.5px;font-weight:600;color:var(--ink);background:var(--cream);transition:.15s;
}
.mini:hover{background:var(--gold);border-color:var(--gold)}
.mini.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.mini.primary:hover{background:#48997f}
.toggles{display:grid;gap:8px;font-size:12.5px;color:rgba(22,36,30,.78)}
.toggles label{display:flex;align-items:center;gap:9px;cursor:pointer}
.toggles input[type=checkbox]{accent-color:var(--teal);width:16px;height:16px}
.toggles select{margin-left:auto;border:1px solid var(--rule);border-radius:8px;padding:5px 7px;font-size:12px;background:var(--cream)}

/* present mode */
body.present .rail,body.present .ribbonbox{display:none}
body.present .shell{grid-template-columns:minmax(0,1fr)}
body.present .wheelwrap{width:min(78vh,100%,760px)}

/* ---------- meme takeover ---------- */
#memeLayer{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;
  padding:20px;overflow:hidden;
}
#memeLayer.on{display:grid}
.flood{position:absolute;inset:0;background:var(--win,#000);opacity:0;animation:flood .5s forwards}
@keyframes flood{to{opacity:.9}}
.rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax;opacity:.16;
  background:repeating-conic-gradient(#000 0 6deg,transparent 6deg 12deg);animation:spinrays 26s linear infinite}
@keyframes spinrays{to{transform:rotate(360deg)}}
.memecard{
  position:relative;z-index:2;width:min(92vw,520px);
  background:var(--paper);border-radius:18px;padding:16px;
  border:6px solid var(--ink);
  box-shadow:0 30px 60px rgba(0,0,0,.5);
  animation:slam .45s cubic-bezier(.2,1.5,.4,1) both;
  text-align:center;
}
@keyframes slam{
  0%{transform:scale(2.2) rotate(-14deg);opacity:0}
  60%{transform:scale(.94) rotate(3deg);opacity:1}
  100%{transform:scale(1) rotate(-1.4deg);opacity:1}
}
.memecard .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(22,36,30,.45);margin-bottom:8px}
.memecard .prize{
  font-family:var(--display);font-weight:800;font-size:clamp(24px,5.4vw,38px);line-height:1.02;
  color:var(--ink);letter-spacing:-.02em;margin-bottom:14px;overflow-wrap:anywhere;
}
.frame{
  position:relative;border-radius:10px;overflow:hidden;background:var(--win,#eee);
  aspect-ratio:1/.86;display:grid;place-items:center;
}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .bigemo{font-size:clamp(72px,20vw,130px);line-height:1;animation:wobble 1.1s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
@keyframes wobble{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.09)}}
.mtext{
  position:absolute;left:8px;right:8px;font-family:var(--meme);
  font-size:clamp(20px,5.4vw,34px);line-height:1.02;color:#fff;text-transform:uppercase;
  -webkit-text-stroke:2.4px #000;paint-order:stroke fill;letter-spacing:.01em;
  text-shadow:0 3px 0 rgba(0,0,0,.35);
}
.mtext.top{top:9px}
.mtext.bot{bottom:9px}
.memecard .odds{margin-top:12px;font-size:12px;color:rgba(22,36,30,.55);display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.memecard .odds b{color:var(--ink)}
.memecard .close{
  margin-top:14px;width:100%;background:var(--ink);color:var(--cream);
  border-radius:11px;padding:12px;font-weight:700;font-size:14px;letter-spacing:.03em;
}
.memecard .close:hover{background:var(--teal)}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}

/* modal */
#modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(9,18,14,.72);padding:20px}
#modal.on{display:grid}
.sheet{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:18px;width:min(94vw,520px);box-shadow:0 24px 50px rgba(0,0,0,.4)}
.sheet h3{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:18px}
.sheet p{margin:0 0 10px;font-size:12.5px;color:rgba(22,36,30,.6)}
.sheet textarea{width:100%;height:210px;border:1px solid var(--rule);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--cream);resize:vertical}
.shakeit{animation:shk .42s}
@keyframes shk{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-9px,5px)}35%{transform:translate(8px,-6px)}
  55%{transform:translate(-6px,-4px)}75%{transform:translate(5px,4px)}
}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .rays,.frame .bigemo{animation:none}
  .memecard{animation-duration:.01ms}
}
@media (max-width:1000px){ .rail{position:static} .rows{max-height:none} }
</style>
</head>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const PAL = ["#FBC748","#53AE9A","#FBD36D","#7FC9AC","#416557","#E8A33D","#3C8C79","#F0E0B0"];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let uid = 0;
const mk = (name, weight, color, emoji, top, bottom) =>
  ({id:++uid, name, weight, color, emoji, top, bottom, img:null});

let items = [
  mk("ICON Hoodie",        2,  "#416557", "🧥", "nobody:",            "absolutely nobody: me at 2%"),
  mk("₱500 Load",          10, "#FBC748", "💸", "when the load hits",  "and it's not even payday"),
  mk("Free Coffee",        15, "#FBD36D", "☕", "one (1) coffee",      "productivity restored"),
  mk("Shoutout on Stream", 20, "#53AE9A", "📣", "mom get the camera",  "i'm on the internet"),
  mk("Sticker Pack",       8,  "#7FC9AC", "✨", "laptop before",       "laptop after"),
  mk("Mystery Box",        5,  "#3C8C79", "📦", "could be anything",   "it's probably a rock"),
  mk("Try Again, Champ",   40, "#E8A33D", "🗿", "the wheel has spoken","and it said no"),
];

/* ---------- audio ---------- */
let AC=null, sound=true;
const ac = () => (AC ||= new (window.AudioContext||window.webkitAudioContext)());
function blip(freq, dur, type="square", vol=.05){
  if(!sound) return;
  try{
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
const tick = () => blip(1200+Math.random()*260,.045,"square",.035);
function fanfare(){
  if(!sound) return;
  [0,120,240,380].forEach((t,i)=>setTimeout(()=>blip([523,659,784,1047][i],.34,"triangle",.09),t));
}

/* ---------- maths ---------- */
const TAU = Math.PI*2;
const START = -Math.PI/2;              // pointer sits at 12 o'clock
function norm(){
  const total = items.reduce((s,i)=>s+Math.max(0,+i.weight||0),0);
  if(!items.length) return [];
  if(total<=0) return items.map(()=>1/items.length);
  return items.map(i=>Math.max(0,+i.weight||0)/total);
}
function bounds(){                      // cumulative [0,TAU) from the pointer
  const w = norm(); const out=[]; let a=0;
  w.forEach(p=>{ out.push([a,a+p*TAU]); a+=p*TAU; });
  return out;
}
const wrap = a => ((a%TAU)+TAU)%TAU;
function indexAt(rot){                  // which slice is under the pointer
  const b = bounds(), t = wrap(-rot);
  for(let i=0;i<b.length;i++) if(t>=b[i][0] && t<b[i][1]) return i;
  return b.length-1;
}
function lum(hex){
  const n=parseInt(hex.slice(1),16);
  const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};
  return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255);
}

/* ---------- wheel drawing ---------- */
const cv=$("#wheel"), cx=cv.getContext("2d");
let rot=0, size=520;
function fit(){
  const r=$("#wheelwrap").getBoundingClientRect();
  size=Math.max(240,Math.min(r.width,r.height));
  const d=Math.min(2,devicePixelRatio||1);
  cv.width=size*d; cv.height=size*d; cx.setTransform(d,0,0,d,0,0);
  draw();
}
new ResizeObserver(fit).observe($("#wheelwrap"));

function draw(){
  const c=size/2, R=c-11;
  cx.clearRect(0,0,size,size);
  const b=bounds();

  cx.save(); cx.translate(c,c);
  // rim
  cx.beginPath(); cx.arc(0,0,R+8,0,TAU);
  cx.fillStyle="#16241E"; cx.fill();
  cx.beginPath(); cx.arc(0,0,R+4,0,TAU);
  cx.strokeStyle="#FBC748"; cx.lineWidth=3; cx.stroke();

  cx.rotate(rot);
  if(!items.length){
    cx.beginPath(); cx.arc(0,0,R,0,TAU); cx.fillStyle="#2B463C"; cx.fill();
    cx.restore(); return;
  }
  items.forEach((it,i)=>{
    const [s,e]=b[i], a0=START+s, a1=START+e;
    if(e-s<=0) return;
    cx.beginPath(); cx.moveTo(0,0); cx.arc(0,0,R,a0,a1); cx.closePath();
    cx.fillStyle=it.color; cx.fill();
    cx.strokeStyle="rgba(22,36,30,.5)"; cx.lineWidth=1.6; cx.stroke();

    const sweep=e-s, mid=(a0+a1)/2;
    if(sweep > .052){
      cx.save(); cx.rotate(mid);
      const dark = lum(it.color) > .52;
      cx.fillStyle = dark ? "#16241E" : "#FBF6E9";
      cx.textAlign="right"; cx.textBaseline="middle";
      const fs=Math.max(11,Math.min(R*.082, R*sweep*.5, 26));
      cx.font=`700 ${fs}px "Space Grotesk", system-ui, sans-serif`;
      let label=it.name||"—";
      const max=R*.63;
      while(cx.measureText(label).width>max && label.length>3) label=label.slice(0,-2)+"…";
      cx.fillText(label, R-Math.max(18,R*.075), 0);
      if(sweep > .18){
        cx.font=`500 ${fs*.66}px "Space Grotesk", system-ui, sans-serif`;
        cx.globalAlpha=.66;
        cx.fillText((sweep/TAU*100).toFixed(1)+"%", R-Math.max(18,R*.075), fs*1.02);
        cx.globalAlpha=1;
      }
      cx.restore();
    }
  });
  // pegs on every boundary
  b.forEach(([s])=>{
    const a=START+s;
    cx.beginPath(); cx.arc(Math.cos(a)*(R-4), Math.sin(a)*(R-4), 3.4, 0, TAU);
    cx.fillStyle="#FBF6E9"; cx.fill();
    cx.strokeStyle="rgba(0,0,0,.4)"; cx.lineWidth=1.2; cx.stroke();
  });
  cx.restore();
}

/* ---------- flapper spring ---------- */
let flap=0, flapV=0;
(function loop(){
  flapV += -flap*0.36 - flapV*0.22;
  flap  += flapV;
  $("#flapper").style.setProperty("--flap", flap.toFixed(2)+"deg");
  requestAnimationFrame(loop);
})();

/* ---------- spinning ---------- */
let spinning=false;
function spin(){
  if(spinning || !items.length) return;
  if(items.length===1){ land(0); return; }
  spinning=true; $("#spinBtn").disabled=true;
  try{ ac().resume(); }catch(e){}

  const dur = reduce ? 1100 : +$("#dur").value;
  const from = rot;
  const turns = reduce ? 2 : 5 + Math.random()*4;
  const to = from + turns*TAU + Math.random()*TAU;   // honest: uniform landing angle
  const t0 = performance.now();
  let lastIdx = indexAt(from);

  (function frame(now){
    const p = Math.min(1,(now-t0)/dur);
    const e = 1-Math.pow(1-p,4);
    rot = from + (to-from)*e;
    draw();
    const idx = indexAt(rot);
    if(idx!==lastIdx){ lastIdx=idx; tick(); flapV = -3.2; }
    if(p<1) requestAnimationFrame(frame);
    else { rot=wrap(to); spinning=false; $("#spinBtn").disabled=false; land(indexAt(rot)); }
  })(t0);
}

function land(i){
  const it=items[i]; if(!it) return;
  const chance = (norm()[i]*100);
  if(!reduce){ $("#wheelwrap").classList.add("shakeit"); setTimeout(()=>$("#wheelwrap").classList.remove("shakeit"),450); }
  fanfare();
  burst(it.color);
  showMeme(it, chance);
  addHistory(it);
  if($("#raffle").checked && items.length>1){
    items = items.filter(x=>x.id!==it.id);
    renderRail(); paint();
  }
}

/* ---------- meme takeover ---------- */
let memeTimer=null;
function showMeme(it, chance){
  const L=$("#memeLayer");
  const esc = s => String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  L.style.setProperty("--win", it.color);
  L.innerHTML = `
    <div class="flood"></div><div class="rays"></div>
    <div class="memecard">
      <div class="eyebrow">SPINCON &middot; the wheel has spoken</div>
      <div class="prize">${esc(it.name||"Mystery")}</div>
      <div class="frame">
        ${it.img ? `<img src="${it.img}" alt="">` : `<div class="bigemo">${esc(it.emoji||"🎉")}</div>`}
        ${it.top    ? `<div class="mtext top">${esc(it.top)}</div>`    : ""}
        ${it.bottom ? `<div class="mtext bot">${esc(it.bottom)}</div>` : ""}
      </div>
      <div class="odds"><span>Chance: <b>${chance.toFixed(1)}%</b></span><span>Roughly <b>1 in ${chance>0?(100/chance).toFixed(1):"∞"}</b></span></div>
      <button class="close">Claim it and spin again</button>
    </div>`;
  L.classList.add("on");
  L.querySelector(".close").onclick = closeMeme;
  L.querySelector(".flood").onclick = closeMeme;
  L.querySelector(".close").focus({preventScroll:true});
  clearTimeout(memeTimer);
  if($("#autoclose").checked) memeTimer=setTimeout(closeMeme, 6500);
}
function closeMeme(){ clearTimeout(memeTimer); $("#memeLayer").classList.remove("on"); $("#memeLayer").innerHTML=""; }

/* ---------- confetti ---------- */
const fx=$("#fx"), fc=fx.getContext("2d");
let bits=[], raf=null;
function sizeFx(){ const d=Math.min(2,devicePixelRatio||1); fx.width=innerWidth*d; fx.height=innerHeight*d; fc.setTransform(d,0,0,d,0,0); }
addEventListener("resize", sizeFx); sizeFx();
function burst(color){
  const cols=[color,"#FBC748","#53AE9A","#FBF6E9","#7FC9AC"];
  const n = reduce ? 34 : 150;
  for(let i=0;i<n;i++) bits.push({
    x:innerWidth/2, y:innerHeight*0.46,
    vx:(Math.random()-.5)*17, vy:-Math.random()*17-4,
    w:5+Math.random()*8, h:8+Math.random()*11,
    r:Math.random()*6.3, vr:(Math.random()-.5)*.42,
    c:cols[i%cols.length], life:1
  });
  if(!raf) raf=requestAnimationFrame(tickFx);
}
function tickFx(){
  fc.clearRect(0,0,innerWidth,innerHeight);
  bits=bits.filter(b=>b.life>0);
  bits.forEach(b=>{
    b.vy+=.42; b.vx*=.994; b.x+=b.vx; b.y+=b.vy; b.r+=b.vr;
    if(b.y>innerHeight+60) b.life=0;
    fc.save(); fc.translate(b.x,b.y); fc.rotate(b.r);
    fc.fillStyle=b.c; fc.fillRect(-b.w/2,-b.h/2,b.w,b.h); fc.restore();
  });
  raf = bits.length ? requestAnimationFrame(tickFx) : null;
  if(!raf) fc.clearRect(0,0,innerWidth,innerHeight);
}

/* ---------- history ---------- */
let log=[];
function addHistory(it){
  log.unshift(it); log=log.slice(0,9);
  const h=$("#history");
  h.innerHTML = `<span class="lbl">Recent</span>` + log.map(x=>
    `<span class="tag"><i style="background:${x.color}"></i>${x.name.replace(/[<>&]/g,"")}</span>`).join("");
}

/* ---------- rail ---------- */
function paint(){
  const w=norm();
  $("#ribbon").innerHTML = items.map((it,i)=>
    `<div style="flex:${w[i]||.0001} 1 0;background:${it.color}" data-pct="${(w[i]*100).toFixed(0)}%" ${w[i]<0.055?'data-narrow':''}></div>`).join("");
  const raw = items.reduce((s,i)=>s+Math.max(0,+i.weight||0),0);
  $("#sumNote").textContent = items.length ? `${items.length} prizes · weights total ${raw}` : "empty wheel";
  $("#oddsNote").textContent = Math.abs(raw-100)<.01 ? "weights add up to 100" : "weights are shared out, they needn't total 100";
  document.querySelectorAll(".pct").forEach((el,i)=> el.textContent=(w[i]*100).toFixed(1)+"%");
  $("#spinBtn").disabled = !items.length || spinning;
  draw();
}

function renderRail(){
  const box=$("#rows"); box.innerHTML="";
  items.forEach(it=>{
    const row=document.createElement("div");
    row.className="row";
    row.innerHTML=`
      <div class="rowmain">
        <button class="swatch" style="background:${it.color}" title="Colour"><input type="color" value="${it.color}"></button>
        <input class="nm" value="${it.name.replace(/"/g,"&quot;")}" placeholder="Prize name" aria-label="Prize name">
        <input class="wt" type="number" min="0" step="0.5" value="${it.weight}" aria-label="Chance weight">
        <span class="pct">0%</span>
        <button class="iconbtn meme" title="Meme for this prize">😂</button>
        <button class="iconbtn del" title="Remove">✕</button>
      </div>
      <div class="mm">
        <input class="emo" value="${(it.emoji||"").replace(/"/g,"&quot;")}" maxlength="4" aria-label="Emoji">
        <input type="text" class="top" value="${(it.top||"").replace(/"/g,"&quot;")}" placeholder="Top meme line">
        <input type="text" class="bot" value="${(it.bottom||"").replace(/"/g,"&quot;")}" placeholder="Bottom meme line">
        <div class="file">
          <label>Upload a picture<input type="file" accept="image/*"></label>
          ${it.img?`<img class="thumb" src="${it.img}" alt="">`:`<span>Otherwise the emoji fills the frame</span>`}
          ${it.img?`<button class="mini clr" style="padding:5px 9px">Remove picture</button>`:""}
        </div>
      </div>`;
    const q=s=>row.querySelector(s);
    q(".swatch input").oninput = e => { it.color=e.target.value; q(".swatch").style.background=it.color; paint(); };
    q(".nm").oninput = e => { it.name=e.target.value; draw(); };
    q(".wt").oninput = e => { it.weight=Math.max(0,+e.target.value||0); paint(); };
    q(".emo").oninput = e => it.emoji=e.target.value;
    q(".top").oninput = e => it.top=e.target.value;
    q(".bot").oninput = e => it.bottom=e.target.value;
    q(".meme").onclick = () => { row.classList.toggle("open"); q(".meme").classList.toggle("on"); };
    q(".del").onclick  = () => { items=items.filter(x=>x.id!==it.id); renderRail(); paint(); };
    q(".file input").onchange = e => {
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ it.img=r.result; renderRail(); paint();
        const again=[...document.querySelectorAll(".row")][items.indexOf(it)];
        if(again){ again.classList.add("open"); again.querySelector(".meme").classList.add("on"); } };
      r.readAsDataURL(f);
    };
    const clr=q(".clr"); if(clr) clr.onclick=()=>{ it.img=null; renderRail(); paint(); };
    box.appendChild(row);
  });
}

/* ---------- controls ---------- */
$("#spinBtn").onclick = spin;
$("#hub").onclick = spin;
addEventListener("keydown", e=>{
  if(e.code==="Space" && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){ e.preventDefault(); 
    $("#memeLayer").classList.contains("on") ? closeMeme() : spin(); }
  if(e.key==="Escape"){ closeMeme(); $("#modal").classList.remove("on"); }
});
$("#addBtn").onclick = () => {
  items.push(mk("New prize", 10, PAL[items.length%PAL.length], "🎁", "", ""));
  renderRail(); paint();
  $("#rows").scrollTop = $("#rows").scrollHeight;
};
$("#evenBtn").onclick = () => { items.forEach(i=>i.weight=+(100/items.length).toFixed(2)); renderRail(); paint(); };
$("#sndBtn").onclick = e => { sound=!sound; e.currentTarget.setAttribute("aria-pressed",sound);
  e.currentTarget.textContent = sound?"🔊 Sound on":"🔇 Sound off"; };
$("#presentBtn").onclick = e => {
  const on=document.body.classList.toggle("present");
  e.currentTarget.setAttribute("aria-pressed",on);
  requestAnimationFrame(fit);
};
$("#jsonBtn").onclick = () => {
  $("#jsonBox").value = JSON.stringify(items.map(({id,...r})=>r), null, 1);
  $("#modal").classList.add("on");
};
$("#closeModal").onclick = () => $("#modal").classList.remove("on");
$("#copyBtn").onclick = async e => {
  try{ await navigator.clipboard.writeText($("#jsonBox").value); e.target.textContent="Copied"; }
  catch{ $("#jsonBox").select(); e.target.textContent="Select and copy"; }
  setTimeout(()=>e.target.textContent="Copy",1600);
};
$("#loadBtn").onclick = e => {
  try{
    const d=JSON.parse($("#jsonBox").value);
    if(!Array.isArray(d)||!d.length) throw 0;
    items = d.map(o=>({id:++uid, name:String(o.name||"Prize"), weight:Math.max(0,+o.weight||0),
      color:/^#[0-9a-f]{6}$/i.test(o.color)?o.color:"#FBC748",
      emoji:o.emoji||"🎉", top:o.top||"", bottom:o.bottom||"", img:o.img||null}));
    renderRail(); paint(); $("#modal").classList.remove("on");
  }catch{ e.target.textContent="That text isn't a wheel — check it and try again"; 
    setTimeout(()=>e.target.textContent="Load this wheel",2600); }
};

renderRail(); fit(); paint();
})();
</script>
</body>
</html>
