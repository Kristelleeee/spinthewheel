<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPINCON</title>
<link rel="icon" type="image/png" href="icon-color.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ambient backdrop: the ICON family drifting behind everything -->
<div class="bg" aria-hidden="true">
  <img src="marks/icon.png"  alt="" style="--x:-4%;  --y:6%;   --s:230px; --d:47s; --r:-9deg;  --dx:70px;  --dy:60px;  --dr:14deg;  --o:.11">
  <img src="marks/scope.png" alt="" style="--x:74%;  --y:2%;   --s:180px; --d:39s; --r:11deg;  --dx:-60px; --dy:70px;  --dr:-18deg; --o:.13; --delay:-6s">
  <img src="marks/aim.png"   alt="" style="--x:82%;  --y:56%;  --s:210px; --d:53s; --r:-14deg; --dx:-80px; --dy:-55px; --dr:20deg;  --o:.14; --delay:-14s">
  <img src="marks/aws.png"   alt="" style="--x:4%;   --y:62%;  --s:165px; --d:44s; --r:8deg;   --dx:75px;  --dy:-65px; --dr:-13deg; --o:.13; --delay:-3s">
  <img src="marks/scope.png" alt="" style="--x:38%;  --y:82%;  --s:120px; --d:58s; --r:-20deg; --dx:55px;  --dy:-45px; --dr:16deg;  --o:.09; --delay:-22s">
  <img src="marks/aim.png"   alt="" style="--x:30%;  --y:-6%;  --s:130px; --d:50s; --r:16deg;  --dx:-45px; --dy:55px;  --dr:-22deg; --o:.09; --delay:-31s">
  <img src="marks/icon.png"  alt="" style="--x:62%;  --y:88%;  --s:150px; --d:41s; --r:5deg;   --dx:-65px; --dy:-50px; --dr:12deg;  --o:.10; --delay:-17s">
  <img src="marks/aws.png"   alt="" style="--x:52%;  --y:30%;  --s:100px; --d:62s; --r:-6deg;  --dx:40px;  --dy:45px;  --dr:-15deg; --o:.07; --delay:-9s">
</div>

<header class="topbar">
  <div class="brandmark"><img src="icon-black.png" alt="ICON"></div>
  <div class="wordmark">
    <b>SPIN<i>CON</i></b>
    <span>ICON &middot; wheel of questionable fortune</span>
  </div>
  <div class="spacer"></div>
  <button class="chip" id="sndBtn" aria-pressed="true">🔊 Sound on</button>
  <button class="chip" id="presentBtn" aria-pressed="false">Present mode</button>
</header>

<main class="shell">
  <section class="stage">
    <div class="wheelwrap" id="wheelwrap">
      <canvas id="wheel"></canvas>
      <div class="flapper" id="flapper" aria-hidden="true">
        <svg viewBox="0 0 52 74">
          <rect x="18" y="0" width="16" height="16" rx="5" fill="#16241E"/>
          <path d="M26 8 L40 52 Q26 74 12 52 Z" fill="#FBC748" stroke="#16241E" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="26" cy="14" r="4" fill="#FBF6E9"/>
        </svg>
      </div>
      <button class="hub" id="hub" title="Spin"><img src="icon-color.png" alt="Spin the ICON wheel"></button>
    </div>

    <button class="spinbtn" id="spinBtn">SPIN IT</button>
    <p class="hint">Press space, or tap the ICON</p>

    <div class="ribbonbox">
      <div class="ribbonhead">
        <h3>True odds</h3>
        <em id="oddsNote">slice width = real chance</em>
      </div>
      <div class="ribbon" id="ribbon"></div>
    </div>

    <div class="history" id="history"><span class="lbl">No spins yet</span></div>
  </section>

  <aside class="rail">
    <div class="railhead">
      <h2>Prize pool</h2>
      <span class="sum" id="sumNote"></span>
    </div>
    <div class="rows" id="rows"></div>
    <div class="railfoot">
      <div class="btnrow">
        <button class="mini primary" id="addBtn">+ Add prize</button>
        <button class="mini" id="evenBtn">Even odds</button>
        <button class="mini" id="jsonBtn">Save / load</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="raffle"> Remove the winner after each spin</label>
        <label><input type="checkbox" id="autoclose" checked> Close the meme by itself</label>
        <label>Spin length <select id="dur">
          <option value="3200">Quick</option>
          <option value="6200" selected>Classic</option>
          <option value="10500">Dramatic</option>
        </select></label>
      </div>
    </div>
  </aside>
</main>

<div id="memeLayer" role="dialog" aria-modal="true"></div>
<canvas id="fx"></canvas>

<div id="modal">
  <div class="sheet">
    <h3>Save or load a wheel</h3>
    <p>Copy this text to keep your wheel. Paste someone else's over it and load to swap the whole pool. Uploaded meme pictures are included.</p>
    <textarea id="jsonBox" spellcheck="false"></textarea>
    <div class="btnrow" style="margin-top:10px">
      <button class="mini primary" id="loadBtn">Load this wheel</button>
      <button class="mini" id="copyBtn">Copy</button>
      <button class="mini" id="closeModal">Close</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
